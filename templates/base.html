<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Concert Watcher{% endblock %}</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v=10">
<script src="/static/app.js?v=4" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
{% if flash %}<div class="toast" role="status" data-toast>{{ flash }}</div>{% endif %}
</body>
</html>
